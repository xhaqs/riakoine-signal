app            = "aware-signal"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_HOST = "aware-signal.fly.dev"
  PORT     = "4000"

[http_service]
  internal_port        = 4000
  force_https          = true
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 10000
    soft_limit = 8000

# Primary: Johannesburg (East + South Africa)
# Secondary: London (West Africa + diaspora)
# Tertiary: Chicago (Americas diaspora)
[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"
